services:
  # Headless Self-hosted LiveSync node: this is the delivery channel that
  # replaces GitHub. It replicates the existing CouchDB against the vault
  # directory the pipeline writes into, so new Zhihu notes reach the Mac, the
  # phone and the iPad without any git step.
  #
  # Scope decision (2026-10-08): the node watches the WHOLE vault directory and
  # runs WITHOUT a path allow-list. LiveSync's syncOnlyRegEx is a path regex
  # applied in both directions, and the user moves notes out of 知乎收藏/ into
  # curated folders (399 of them) and deletes some on purpose - a prefix scoped
  # to where the pipeline drops files cannot follow that, and would leave stale
  # copies on the NAS that get pushed back over the devices. Mounting the full
  # vault is what makes moves and deletions behave correctly. Consequence: the
  # NAS keeps a plaintext replica of the whole vault, which is the user's own
  # device and already had one (see AGENTS.md).
  #
  # Build the image from the upstream repository first:
  #   git clone --depth 1 https://github.com/vrtmrz/obsidian-livesync.git
  #   cd obsidian-livesync
  #   docker build -f src/apps/cli/Dockerfile -t zhihu-livesync-node:latest .
  livesync-node:
    image: zhihu-livesync-node:latest
    container_name: zhihu-livesync-node
    network_mode: "host"          # reach CouchDB on 127.0.0.1:5984, no public tunnel
    user: root                    # node-data is owned by admin:700 on the NAS; a
                                  # non-root container silently fails to activate
    environment:
      - TZ=Asia/Shanghai
      # Empty means: use the CouchDB _changes feed (real-time). Set to N seconds
      # to fall back to polling if the feed ever stalls behind the tunnel.
      - LIVESYNC_INTERVAL=
    # `daemon` = one mirror scan, then continuous two-way sync, and it DOES
    # propagate deletions. That is the point: a note deleted or moved on a phone
    # must not survive on the NAS and get re-pushed to every device, which is
    # what the cron-style `mirror` loop used here before would have done.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$${LIVESYNC_INTERVAL}" ]; then
          set -- daemon --interval "$${LIVESYNC_INTERVAL}"
        else
          set -- daemon
        fi
        exec node /app/dist/index.cjs /data \
          --settings /data/livesync-settings.json \
          --vault /vault "$@"
    volumes:
      # PouchDB state + settings. Never inside /vault, or the node would sync
      # its own database into the notes.
      - ${LIVESYNC_DATA_DIR:-./node-data}:/data
      # The vault the pipeline writes to. Contains .git and .pipeline while the
      # git channel is still the rollback path; both are excluded by
      # syncIgnoreRegEx so they never become documents.
      - ${LIVESYNC_VAULT_DIR:-/share/homes/hardass/zhihu-pipeline/notes}:/vault:delegated
    mem_limit: 1024m              # `free` reports ~10GB idle; the old 512m guess was for RAM-starved boxes
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
