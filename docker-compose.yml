services:
  zhihu-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhihu-pipeline:latest
    container_name: zhihu-pipeline
    network_mode: "host"
    environment:
      - PYTHONUNBUFFERED=1
      - CHROME_USER_DATA_DIR=/app/chrome_profile
      - OUTPUT_VAULT_PATH=/app/notes
    volumes:
      # Source code and entrypoint live mount
      - ./src:/app/src
      - ./entrypoint.sh:/app/entrypoint.sh
      # Persistent browser profile (preserves login cookies & session)
      - ./chrome_profile:/app/chrome_profile
      # Configuration
      - ./config.yaml:/app/config.yaml
      # Obsidian notes output directory (defaults to ./notes in project directory)
      - ${NOTES_DIR:-./notes}:/app/notes
    command: ["bot"]
    restart: unless-stopped
