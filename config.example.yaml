# Zhihu Collection Pipeline Example Config File (Copy and rename to config.yaml)

# Chrome & Browser Connection
chrome:
  user_data_dir: "~/.zhihu_pipeline/chrome_profile"  # Directory where browser login cookies/context are saved
  headless: false                                    # Set to false for Xvfb in Docker to avoid anti-bot blocks
  debug_port: 9222                                   # Deprecated fallback port

# Telegram Notification (Auto Push QR Code when login expires & Remote Bot Control)
telegram:
  enabled: true                                      # Enable Telegram push notifications
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"               # Obtained from @BotFather
  chat_id: "YOUR_TELEGRAM_CHAT_ID"                   # Obtained from @userinfobot
  timeout: 300                                       # Maximum wait time for QR code scanning in seconds

# GitHub Auto-Sync (Automatically pushes notes & assets to your remote GitHub notes repository)
git:
  enabled: false                                     # Set to true to enable auto git pull/push
  repo_url: "https://<USERNAME>:<PAT_OR_TOKEN>@github.com/<USERNAME>/<REPO>.git"
  branch: "main"
  user_name: "YOUR_GITHUB_USERNAME"
  user_email: "YOUR_GITHUB_EMAIL"
  auto_pull: true                                    # Pull latest notes before downloading
  auto_push: true                                    # Push new notes and assets after downloading

# Sync Settings
sync:
  collections: "all"              # "all" or a list of collection names e.g. ["Design", "Hack"]
  include_comments: true          # Whether to fetch comments
  max_comments: 20                # Max comments to fetch per item
  delay_min: 3                    # Minimum delay between requests in seconds
  delay_max: 8                    # Maximum delay between requests in seconds
  remove_after_sync: true         # Automatically remove item from collection after download (Inbox queue pattern)
  auto_archive: false             # Deprecated (set to false)
  schedule_enabled: true          # Enable background automated periodic sync
  schedule_interval_hours: 2.0    # Average base interval in hours
  schedule_jitter_minutes: 25.0   # Random interval jitter (±25m) to avoid periodic crawling patterns

# Obsidian Output
output:
  vault_path: "~/notes"           # Replace with your Obsidian vault path (supports ~ expansion)
  collection_dir: "知乎收藏"
  image_naming: "file-${date:YYYYMMDDHHmmssSSS}"

# CSS Selectors (Tweak selectors here if Zhihu frontend layout changes without altering source code)
selectors:
  answer:
    question_title: "h1.QuestionHeader-title"
    content: "div.RichContent-inner"
    author: "div.AuthorInfo meta[itemprop='name']"
    vote_count: "button.VoteButton--up"
    time: "div.ContentItem-time"
  article:
    title: "h1.Post-Title"
    content: "div.Post-RichTextContainer"
    author: "div.AuthorInfo meta[itemprop='name']"
    time: "div.ContentItem-time"

# Auto-tagging (Requires local LM Studio instance running)
tagger:
  enabled: false                   # Global toggle: false = download only, no tagging
  backend: "local"                 # "local" (LM Studio) | "gemini" (Not implemented yet)
  lm_studio_url: "http://localhost:1234"
  model: "qwen2.5-3b-instruct-mlx"
  timeout: 120                     # Local inference timeout (seconds)
  valid_domains:
    - AI
    - Product
    - Engineering
    - Career
    - Finance
    - Life
    - Home
    - Hobbies
    - Psychology
    - Parenting
