# Zhihu Collection Pipeline Example Config File (Copy and rename to config.yaml)

# Chrome & Browser Connection
chrome:
  user_data_dir: "~/.zhihu_pipeline/chrome_profile"  # Directory where browser login cookies/context are saved
  headless: false                                    # Set to false for Xvfb in Docker to avoid anti-bot blocks
  debug_port: 9222                                   # Deprecated fallback port

# Unified Notification Gateway (Cloudflare Worker notify-gateway)
notify:
  enabled: true                                      # Enable notification gateway
  gateway_url: "https://notify.example.com/send"      # Replace with your gateway endpoint
  api_key: "YOUR_NOTIFY_GATEWAY_API_KEY"             # Or set via NOTIFY_GATEWAY_KEY or ~/.notify_key
  service: "ZhihuPipeline"                           # Service tag identifier
  timeout: 300                                       # Maximum wait time for QR code scanning in seconds

# Telegram Bot control plane (Optional; scheduler and QR notifications do not need it)
telegram:
  enabled: false                                     # Enable only if /sync and /status commands are wanted
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"               # Obtained from @BotFather
  chat_id: "YOUR_TELEGRAM_CHAT_ID"                   # Obtained from @userinfobot
  timeout: 300                                       # Maximum wait time for QR code scanning in seconds


# Delivery channel for notes produced by this pipeline.
# "notes land on disk" is not the same as "notes were published", and the
# pipeline now refuses to confuse the two: it only consumes an item from the
# Zhihu inbox after the configured channel proves the document arrived.
git:
  enabled: false                                     # Set to true only for sync_mode: git
  # git      -> publish with GitHub pull/push (this process owns delivery)
  # livesync -> a headless Self-hosted LiveSync node mirrors the vault into
  #             CouchDB; GitHub is not contacted at all, not even pulled
  # none     -> nothing publishes (used to pause delivery safely)
  sync_mode: "git"
  repo_url: "https://<USERNAME>:<PAT_OR_TOKEN>@github.com/<USERNAME>/<REPO>.git"
  branch: "main"
  user_name: "YOUR_GITHUB_USERNAME"
  user_email: "YOUR_GITHUB_EMAIL"
  auto_pull: true                                    # Pull latest notes before downloading
  auto_push: true                                    # Push new notes and assets after downloading

# Self-hosted LiveSync delivery verification (read-only; only used when
# git.sync_mode is "livesync"). This pipeline never writes to CouchDB itself -
# it only asks whether the LiveSync node has published the new notes yet.
livesync:
  enabled: false                                     # true when a node mirrors this vault into CouchDB
  couchdb_url: "http://127.0.0.1:5984"                # Same-host CouchDB avoids the public tunnel
  db_name: "obsidian-vault"
  username: "obsidian_admin"                          # Or LIVESYNC_COUCHDB_USER
  password: ""                                        # Leave empty; set LIVESYNC_COUCHDB_PASSWORD
  node_name: ""                                       # device_name the node writes in the milestone doc
  timeout: 10.0                                       # Per-request HTTP timeout (seconds)
  verify_timeout_seconds: 90.0                        # How long to wait for the node to publish
  verify_poll_interval_seconds: 5.0
  node_max_stale_minutes: 30.0                        # Older node heartbeat == dead channel
  use_path_obfuscation: false                         # Keep false: cursor-only proof never justifies deleting a source

# Sync Settings
sync:
  collections: "all"              # "all" or a list of collection names e.g. ["Design", "Hack"]
  include_comments: true          # Whether to fetch comments
  max_comments: 20                # Max comments to fetch per item
  delay_min: 3                    # Minimum delay between requests in seconds
  delay_max: 8                    # Maximum delay between requests in seconds
  remove_after_sync: true         # Automatically remove item from collection after download (Inbox queue pattern)
  auto_archive: false             # Deprecated (set to false)
  schedule_enabled: true          # Enable background automated periodic sync
  schedule_interval_hours: 2.0    # Average base interval in hours
  schedule_jitter_minutes: 25.0   # Random interval jitter (±25m) to avoid periodic crawling patterns
  video_enabled: true             # Download videos embedded in Zhihu pins
  video_quality: "ld"             # ld is the smallest rendition and is mobile-friendly
  video_max_size_mb: 50.0          # Fail closed above the LiveSync/CouchDB safe boundary

# Obsidian Output
output:
  vault_path: "~/notes"           # Replace with your Obsidian vault path (supports ~ expansion)
  collection_dir: "知乎收藏"
  image_naming: "file-${date:YYYYMMDDHHmmssSSS}"
  # State file location, relative to vault_path. A dot-directory is deliberate:
  # Obsidian does not surface it, so neither the Git channel nor the LiveSync
  # node can carry the pipeline's own state to another device and back. An
  # existing {collection_dir}/manifest.json is migrated automatically once.
  # Leave empty to keep the legacy location inside the synced tree.
  manifest_path: ".pipeline/manifest.json"

# CSS Selectors (Tweak selectors here if Zhihu frontend layout changes without altering source code)
selectors:
  answer:
    question_title: "h1.QuestionHeader-title"
    content: "div.RichContent-inner"
    author: "div.AuthorInfo meta[itemprop='name']"
    vote_count: "button.VoteButton--up"
    time: "div.ContentItem-time"
  article:
    title: "h1.Post-Title"
    content: "div.Post-RichTextContainer"
    author: "div.AuthorInfo meta[itemprop='name']"
    time: "div.ContentItem-time"

# Auto-tagging (GB10 remote service or another OpenAI-compatible API)
tagger:
  enabled: true                    # NAS mode: download and tag before GitHub push
  backend: "openai_compatible"    # Works with GB10, LM Studio, DeepSeek, SiliconFlow, OpenAI, etc.
  base_url: "https://your-gb10-host.example/v1"
  model: "qwen3-coder-next"
  api_key: "YOUR_TAGGER_API_KEY"  # Prefer TAGGER_API_KEY instead of committing a key to disk.
  timeout: 120                     # Inference timeout (seconds)
  valid_domains:
    - AI
    - Product
    - Engineering
    - Career
    - Finance
    - Life
    - Home
    - Hobbies
    - Psychology
    - Parenting
